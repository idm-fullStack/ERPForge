name: SSG Docs Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MkDocs
        run: |
          pip install mkdocs mkdocs-material

      - name: Build MkDocs
        run: |
          cd ERPForge/command_repo/docs
          mkdocs build -f mkdocs.tz.yml -d site_tz

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './ERPForge/command_repo/docs/site_tz/'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
