name: Infrastructure Deploy

on:
  push:
    branches: [main]
    paths:
      - '05_infrastructure/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_VAR_aws_region: eu-central-1
  TF_VAR_project: erpforge
  TF_VAR_environment: production

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.TF_VAR_aws_region }}

      - name: Terraform Init
        run: |
          cd 05_infrastructure/terraform
          terraform init

      - name: Terraform Plan
        run: |
          cd 05_infrastructure/terraform
          terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: |
          cd 05_infrastructure/terraform
          terraform apply tfplan

  kubernetes:
    runs-on: ubuntu-latest
    needs: terraform
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" > kubeconfig
          export KUBECONFIG=$(pwd)/kubeconfig

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f 05_infrastructure/k8s/namespace.yaml
          kubectl apply -f 05_infrastructure/k8s/
          kubectl rollout status deployment/erpforge-api
          kubectl rollout status deployment/erpforge-web