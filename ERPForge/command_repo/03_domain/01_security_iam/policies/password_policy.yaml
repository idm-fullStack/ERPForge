# ============================================
# Политика: Парольная политика
# ============================================
version: "1.0.0"
name: "password_policy"
description: "Политика безопасности паролей"

# Требования к паролю
requirements:
  min_length: 12
  max_length: 64
  require_uppercase: true
  require_lowercase: true
  require_numbers: true
  require_special: true
  allowed_special: "!@#$%^&*()_+-=[]{}|;:,.<>?/~"

  forbidden_patterns:
    - "sequential_characters"  
    - "sequential_keyboard"   
    - "user_name"
    - "email"
    - "common_password"

# Сроки
lifetime:
  max_age_days: 90
  min_age_days: 1
  prevent_reuse: 5
  history_count: 10

# Блокировки
lockout:
  max_attempts: 5
  lockout_minutes: 30
  reset_attempts_after_minutes: 60

# 2FA
two_factor:
  required_for_roles:
    - "admin"
    - "accountant"
    - "auditor"
  required_for_actions:
    - "delete"
    - "post"
    - "fire"
    - "assign_role"
  grace_period_days: 7
  allowed_methods:
    - "totp"
    - "sms"
    - "email"
    - "webauthn"

# Сессии
session:
  max_lifetime_hours: 8
  refresh_token_lifetime_days: 30
  idle_timeout_minutes: 30
  max_concurrent_sessions: 5

# Уведомления
notifications:
  on_suspicious_login: true
  on_password_change: true
  on_2fa_enabled: true
  on_2fa_disabled: true

# Примеры валидных паролей
examples:
  - "Secure@Pass123!"
  - "MyStrong#Pass45"
  - "Work&Life@2025"

invalid_examples:
  - "password123"      
  - "12345678"         
  - "qwerty"           
  - "admin"            
  - "password"        

messages:
  min_length: "Пароль должен содержать минимум {length} символов"
  require_uppercase: "Пароль должен содержать заглавную букву"
  require_lowercase: "Пароль должен содержать строчную букву"
  require_numbers: "Пароль должен содержать цифру"
  require_special: "Пароль должен содержать специальный символ"
  forbidden_pattern: "Пароль содержит запрещенный паттерн"
  common_password: "Пароль слишком простой"
  reused_password: "Пароль уже использовался ранее"
  too_recent: "Пароль можно изменить не ранее чем через {days} дней"