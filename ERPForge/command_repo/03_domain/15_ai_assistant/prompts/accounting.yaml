# ============================================
# Промпты: Бухгалтерские консультации
# ============================================
name: "accounting_prompts"
type: prompts
version: "1.0.0"
description: "Шаблоны промптов для бухгалтерских вопросов"

system_prompt: |
  Ты - эксперт по бухгалтерскому учету. Твоя задача - помогать бухгалтерам и предпринимателям с вопросами учета.

  Области знаний:
  - План счетов (Россия, IFRS)
  - Проводки (хозяйственные операции)
  - Налоговый учет (ОСНО, УСН, НДС, НДФЛ)
  - Первичная документация
  - Отчетность

  Формат ответа:
  - Давай четкие проводки (Дебет/Кредит)
  - Ссылайся на нормативные документы
  - Используй примеры из практики
  - Предупреждай о рисках

templates:
  - name: "posting_help"
    description: "Помощь с проводками"
    prompt: |
      Какой проводкой оформить операцию?
      Тип операции: {operation_type}
      Сумма: {amount}
      Контрагент: {counterparty}
      Документ: {document_type}
      
      Расскажи правильную проводку с пояснением.

  - name: "tax_question"
    description: "Вопросы по налогам"
    prompt: |
      Вопрос по налогам:
      Тип налога: {tax_type}
      Ситуация: {situation}
      Период: {period}
      
      Объясни правила расчета и уплаты налога.

  - name: "document_question"
    description: "Вопросы по документам"
    prompt: |
      Вопрос по документу:
      Документ: {document_type}
      Вопрос: {question}
      
      Помоги разобраться с заполнением и проведением.

  - name: "report_question"
    description: "Вопросы по отчетности"
    prompt: |
      Вопрос по отчетности:
      Отчет: {report_name}
      Период: {period}
      Вопрос: {question}
      
      Расскажи как заполнить и сдать отчет.

  - name: "posting_example"
    description: "Примеры проводок"
    prompt: |
      Приведи пример проводки:
      Операция: {operation}
      Условия: {conditions}
      
      Дай полную проводку с пояснением.

examples:
  - template: "posting_help"
    inputs:
      operation_type: "реализация товаров"
      amount: 159800.00
      counterparty: "ООО Ромашка"
      document_type: "SalesInvoice"
    output: |
      Проводки для реализации товаров:
      
      1. Дт 62.01 Кт 90.01 - 159 800 руб (Выручка от реализации)
      2. Дт 90.03 Кт 68.02 - 26 633 руб (НДС)
      3. Дт 90.02 Кт 41.01 - 134 000 руб (Себестоимость)
      
       Примечание:
      - Входящий НДС принят к вычету при наличии счета-фактуры
      - Проводки создаются в день отгрузки