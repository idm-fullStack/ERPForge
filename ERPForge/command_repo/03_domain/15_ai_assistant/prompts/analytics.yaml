# ============================================
# Промпты: Аналитика и бизнес-показатели
# ============================================
name: "analytics_prompts"
type: prompts
version: "1.0.0"
description: "Шаблоны промптов для аналитических вопросов"

system_prompt: |
  Ты - бизнес-аналитик. Твоя задача - помогать предпринимателям и менеджерам с анализом бизнес-показателей.

  Области знаний:
  - Юнит-экономика (CAC, LTV, Churn)
  - Финансовый анализ
  - Маркетинговая аналитика
  - Прогнозирование
  - Когортный анализ

  Формат ответа:
  - Используй четкие цифры и формулы
  - Визуализируй данные (графики, таблицы)
  - Дай практические рекомендации
  - Покажи тренды и аномалии

templates:
  - name: "unit_economics"
    description: "Юнит-экономика"
    prompt: |
      Проанализируй юнит-экономику:
      Период: {period}
      Компания: {company}
      Показатели за период:
      - Выручка: {revenue}
      - COGS: {cogs}
      - Маркетинговые расходы: {marketing_cost}
      - Новые клиенты: {new_customers}
      - Клиенты: {total_customers}
      
      Рассчитай:
      1. Маржинальность
      2. CAC
      3. LTV
      4. LTV/CAC
      5. Срок окупаемости
      6. Churn Rate

  - name: "financial_health"
    description: "Финансовое здоровье"
    prompt: |
      Оцени финансовое здоровье бизнеса:
      Период: {period}
      Доходы: {revenue}
      Расходы: {expenses}
      Дебиторка: {receivables}
      Кредиторка: {payables}
      Остаток: {balance}
      
      Рассчитай:
      1. Чистую прибыль
      2. Рентабельность
      3. Финансовый цикл
      4. Платежеспособность

  - name: "growth_trends"
    description: "Тренды роста"
    prompt: |
      Проанализируй тренды роста:
      Период: {period}
      Показатели по месяцам: {monthly_data}
      
      Определи:
      1. Основные тренды
      2. Сезонность
      3. Точки роста
      4. Риски

  - name: "forecast_request"
    description: "Прогнозирование"
    prompt: |
      Сделай прогноз на {period}:
      Исторические данные: {history_data}
      Влияющие факторы: {factors}
      
      Спрогнозируй:
      1. Выручку
      2. Расходы
      3. Прибыль
      4. Денежный поток

examples:
  - template: "unit_economics"
    inputs:
      period: "Январь 2025"
      company: "ООО Ромашка"
      revenue: 159800.00
      cogs: 134000.00
      marketing_cost: 150000.00
      new_customers: 10
      total_customers: 45
    output: |
       Анализ юнит-экономики ООО Ромашка за Январь 2025:
      
      Расчеты:
      
      1. Маржинальность:
         Валовая маржа = 159 800 - 134 000 = 25 800 руб
         Маржинальность = 25 800 / 159 800 * 100 = 16.1%
      
      2. CAC (Cost of Acquisition):
         CAC = 150 000 / 10 = 15 000 руб
      
      3. LTV (Lifetime Value):
         Средний чек = 159 800 / 45 = 3 551 руб
         LTV = 3 551 * 12 * 1.2 = 51 134 руб
      
      4. LTV/CAC = 51 134 / 15 000 = 3.4x ✓
         Хороший показатель (рекомендуется > 3x)
      
      5. Срок окупаемости:
         Чистая прибыль на клиента = 25 800 / 10 = 2 580 руб
         Окупаемость = 15 000 / 2 580 = 5.8 месяцев
      
      6. Churn Rate:
         Отток = 5 / 45 = 11.1% 
         Внимание! Рекомендуемый показатель < 5%
      
       Рекомендации:
      1. Снизить CAC до 12 000 руб
      2. Улучшить удержание клиентов
      3. Увеличить LTV до 70 000 руб