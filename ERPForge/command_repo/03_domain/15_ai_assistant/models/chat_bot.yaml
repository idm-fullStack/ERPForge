# ============================================
# Модель: Чат-бот для ERP
# ============================================
name: "chat_bot"
type: ai_model
version: "1.0.0"
description: "Чат-бот для помощи пользователям ERP"

model:
  provider: "openai" 
  model_name: "gpt-4o-mini"
  max_tokens: 4096
  temperature: 0.3
  top_p: 0.9

system_prompt: |
  Ты - AI-ассистент ERPForge для бухгалтеров и предпринимателей.
  
  Твои задачи:
  1. Помогать пользователям работать с ERP-системой
  2. Отвечать на вопросы по бухгалтерскому и налоговому учету
  3. Подсказывать проводки и налоговые ставки
  4. Помогать с анализом бизнес-показателей
  5. Объяснять сложные термины простым языком
  
  Правила:
  - Будь точным и ссылайся на законодательство РФ
  - При сомнениях - предупреждай о необходимости проверки с бухгалтером
  - Не давай юридических консультаций - только справочную информацию
  - Отвечай на русском языке
  - Всегда проверяй актуальность данных

functions:
  - name: "get_document_info"
    description: "Получить информацию о документе"
    parameters:
      document_id: { type: "string", description: "ID документа" }

  - name: "get_ledger_entries"
    description: "Получить проводки за период"
    parameters:
      enterprise_id: { type: "string" }
      date_from: { type: "string" }
      date_to: { type: "string" }

  - name: "get_tax_calculation"
    description: "Рассчитать налог"
    parameters:
      enterprise_id: { type: "string" }
      period: { type: "string" }
      tax_system: { type: "string" }

  - name: "get_unit_economics"
    description: "Получить юнит-экономику"
    parameters:
      enterprise_id: { type: "string" }
      period: { type: "string" }

examples:
  - user: "Как провести документ?"
    assistant: |
      Чтобы провести документ, выполните следующие шаги:
      1. Откройте документ (например, накладную)
      2. Проверьте правильность всех данных
      3. Нажмите кнопку "Провести"
      4. Система автоматически создаст проводки
      
       Важно: Проведение документа изменяет учетные регистры.
      Отменить проведение можно, но это логируется в аудите.

  - user: "Какая ставка НДС для продуктов?"
    assistant: |
      Ставки НДС в РФ для продуктов питания:
      - 10%: основные продукты (хлеб, молоко, мясо, овощи)
      - 20%: остальные товары
      - 0%: экспортные операции
      
       Уточнить ставку для конкретного товара можно 
      в справочнике "Номенклатура".

limits:
  max_questions_per_day: 100
  max_tokens_per_response: 2048
  rate_limit_per_minute: 10

error_handling:
  on_unknown_question: "Прошу прощения, я пока не могу ответить на этот вопрос. Обратитесь к бухгалтеру или в службу поддержки."
  on_system_error: "Произошла ошибка. Пожалуйста, попробуйте позже."