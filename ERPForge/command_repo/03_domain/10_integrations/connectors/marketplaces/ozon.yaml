# ============================================
# Коннектор: Ozon Маркетплейс
# ============================================
name: "ozon"
type: connector
version: "1.0.0"
description: "Коннектор для интеграции с маркетплейсом Ozon"

# Настройки подключения
connection:
  base_url: "https://api.ozon.ru"
  timeout: 30
  retry: 3

# Авторизация
auth:
  type: "api_key"
  header: "X-API-Key"
  credentials:
    client_id: "{OZON_CLIENT_ID}"
    api_key: "{OZON_API_KEY}"

# Операции
operations:
  # Импорт товаров
  import_products:
    method: "POST"
    path: "/v3/product/import"
    mapping:
      ozon_to_erpforge:
        product_id: "id"
        name: "name"
        sku: "sku"
        price: "price"
        stock: "stock"
        category: "category"

  # Получение заказов
  get_orders:
    method: "POST"
    path: "/v3/orders/list"
    params:
      status: "processed"
      page: "{page}"
      page_size: 50

  # Экспорт остатков
  export_stock:
    method: "POST"
    path: "/v3/stock/update"
    payload:
      stocks:
        - sku: "{sku}"
          stock: "{quantity}"

  # Получение отчетов по продажам
  get_sales:
    method: "POST"
    path: "/v3/report/sales"
    params:
      date_from: "{date_from}"
      date_to: "{date_to}"

# Синхронизация
sync:
  schedule: "every_6_hours"
  batch_size: 100

# Обработка ошибок
error_handling:
  retry_on:
    - "timeout"
    - "rate_limit"
  max_retries: 3
  retry_delay: 60