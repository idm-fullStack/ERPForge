# ============================================
# Настройки: Email канал уведомлений
# ============================================
name: "email"
type: channel
version: "1.0.0"
description: "Настройки email уведомлений"


smtp:
  host: "{SMTP_HOST}"
  port: 587
  secure: true
  auth: true
  username: "{SMTP_USERNAME}"
  password: "{SMTP_PASSWORD}"

from:
  name: "ERPForge"
  email: "noreply@erpforge.com"


options:
  html: true
  track_opens: true
  track_clicks: true
  reply_to: "support@erpforge.com"


templates:
  header: |
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>{{subject}}</title>
      <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: #00897B; padding: 20px; color: white; }
        .content { padding: 20px; background: #f9f9f9; }
        .footer { padding: 20px; text-align: center; color: #666; font-size: 12px; }
      </style>
    </head>
    <body>
      <div class="container">
        <div class="header">
          <h1>ERPForge</h1>
        </div>
        <div class="content">

  footer: |
        </div>
        <div class="footer">
          <p>ERPForge - Система управления бизнесом</p>
          <p>Это автоматическое уведомление. Не отвечайте на это письмо.</p>
          <p><a href="{{unsubscribe_link}}">Отписаться от уведомлений</a></p>
        </div>
      </div>
    </body>
    </html>


queue:
  enabled: true
  max_retries: 3
  retry_delay: 300
  rate_limit: 100


error_handling:
  retry_on: ["timeout", "connection_refused", "rate_limit"]
  max_retries: 3
  retry_delay: 60