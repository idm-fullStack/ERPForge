  - id: "ca0e8400-e29b-41d4-a716-446655440002"
    code: "USER_LOGIN_FAILED"
    name: "Неудачная попытка входа"
    category: "authentication"
    severity: "warning"
    description: "Неудачная попытка входа в систему"
    required_fields: ["email", "ip_address", "timestamp"]
