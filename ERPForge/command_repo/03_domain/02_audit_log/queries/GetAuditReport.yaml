# ============================================
# Запрос: Отчет по аудиту для налоговой
# ============================================
name: "GetAuditReport"
description: "Формирование отчета по аудиту для налоговой инспекции"
version: "1.0.0"

inputs:
  - tenant_id:
      type: uuid
      required: true
      description: "ID клиента"

  - enterprise_id:
      type: uuid
      required: true
      description: "ID юридического лица"

  - year:
      type: integer
      required: true
      min: 2020
      max: 2050
      description: "Год отчета"
      example: 2025

  - quarter:
      type: integer
      nullable: true
      min: 1
      max: 4
      description: "Квартал (если не указан, то за весь год)"

  - report_type:
      type: string
      required: true
      enum: ["full", "financial", "tax", "users", "system", "compliance"]
      default: "full"
      description: "Тип отчета"

  - include_details:
      type: boolean
      default: true
      description: "Включить детализацию"

  - format:
      type: string
      enum: ["json", "csv", "pdf", "xlsx"]
      default: "json"
      description: "Формат вывода"

outputs:
  - report:
      type: object
      description: "Отчет по аудиту"
      properties:
        meta:
          type: object
          properties:
            tenant_id: { type: uuid }
            tenant_name: { type: string }
            enterprise_id: { type: uuid }
            enterprise_name: { type: string }
            inn: { type: string }
            report_type: { type: string }
            period: { type: string }
            generated_at: { type: datetime }
            generated_by: { type: uuid }

        summary:
          type: object
          description: "Сводная информация"
          properties:
            total_events: { type: integer }
            events_by_category:
              type: object
              properties:
                authentication: { type: integer }
                authorization: { type: integer }
                data_modification: { type: integer }
                financial: { type: integer }
                compliance: { type: integer }
                system: { type: integer }
            events_by_severity:
              type: object
              properties:
                info: { type: integer }
                warning: { type: integer }
                error: { type: integer }
                critical: { type: integer }
                audit_required: { type: integer }
            unique_users: { type: integer }
            events_by_user:
              type: array
              items:
                type: object
                properties:
                  user_id: { type: uuid }
                  user_name: { type: string }
                  count: { type: integer }
            events_by_month:
              type: array
              items:
                type: object
                properties:
                  month: { type: string }
                  count: { type: integer }

        financial_events:
          type: array
          description: "Финансовые события (для налоговой)"
          items:
            type: object
            properties:
              date: { type: datetime }
              event: { type: string }
              user: { type: string }
              document_id: { type: uuid }
              document_type: { type: string }
              amount: { type: numeric }
              details: { type: object }

        user_activity:
          type: array
          description: "Активность пользователей"
          items:
            type: object
            properties:
              user_id: { type: uuid }
              user_name: { type: string }
              first_action: { type: datetime }
              last_action: { type: datetime }
              total_actions: { type: integer }
              unique_ips: { type: integer }

        suspicious_events:
          type: array
          description: "Подозрительные события"
          items:
            type: object
            properties:
              event_id: { type: uuid }
              event_code: { type: string }
              user: { type: string }
              timestamp: { type: datetime }
              reason: { type: string }
              details: { type: object }

security:
  - "Доступ только для пользователей с ролью 'admin' или 'auditor'"
  - "Доступ только к своему tenant_id"
  - "Логирование запроса в аудит"
  - "Отчет подписывается электронной подписью"

