# ============================================
# Бенчмарки: Средние показатели по отраслям
# ============================================
version: "1.0.0"
type: benchmarks
name: "industry_benchmarks"
description: "Средние показатели по отраслям для сравнения"

benchmarks:
  - industry: "retail"
    average_margin_percent: 25.0
    average_cac: 15000.00
    average_ltv: 60000.00
    ltv_cac_ratio: 4.0
    average_churn_rate: 5.0
    average_payback_months: 3
    source: "Retail Industry Report 2024"

  - industry: "saas"
    average_margin_percent: 70.0
    average_cac: 20000.00
    average_ltv: 120000.00
    ltv_cac_ratio: 6.0
    average_churn_rate: 3.0
    average_payback_months: 6
    source: "SaaS Metrics Benchmark 2024"

  - industry: "manufacturing"
    average_margin_percent: 30.0
    average_cac: 25000.00
    average_ltv: 80000.00
    ltv_cac_ratio: 3.2
    average_churn_rate: 8.0
    average_payback_months: 5
    source: "Manufacturing Industry Report 2024"

  - industry: "wholesale"
    average_margin_percent: 15.0
    average_cac: 10000.00
    average_ltv: 40000.00
    ltv_cac_ratio: 4.0
    average_churn_rate: 7.0
    average_payback_months: 4
    source: "Wholesale Trade Report 2024"

  - industry: "consulting"
    average_margin_percent: 40.0
    average_cac: 5000.00
    average_ltv: 50000.00
    ltv_cac_ratio: 10.0
    average_churn_rate: 10.0
    average_payback_months: 2
    source: "Consulting Industry Report 2024"

comparison:
  - metric: "margin_percent"
    label: "Маржинальность"
    thresholds:
      good: "> industry_average + 10%"
      average: "industry_average ± 10%"
      bad: "< industry_average - 10%"

  - metric: "ltv_cac_ratio"
    label: "Соотношение LTV/CAC"
    thresholds:
      good: "> industry_average + 1"
      average: "industry_average ± 1"
      bad: "< industry_average - 1"

  - metric: "churn_rate"
    label: "Отток клиентов"
    thresholds:
      good: "< industry_average - 2%"
      average: "industry_average ± 2%"
      bad: "> industry_average + 2%"