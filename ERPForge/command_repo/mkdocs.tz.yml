site_name: "Техническое задание ERPForge"
site_url: "https://ERPForge.github.io/ERPForge/"
site_description: "Техническое задание на разработку ERP-системы"

theme:
  name: material
  language: ru
  palette:
    primary: teal
    accent: cyan
  features:
    - navigation.sections
    - navigation.expand
    - toc.integrate

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - "Введение": "index.md"
  - "1. Общие сведения": "01_scope.md"
  - "2. Назначение и цели": "02_goals.md"
  - "3. Характеристики объекта": "03_characteristics.md"
  - "4. Требования к системе": "04_requirements.md"
  - "5. Архитектура": "05_architecture.md"
  - "6. Модули (домены)": "06_modules.md"
  - "7. Интеграции": "07_integrations.md"
  - "8. Безопасность": "08_security.md"
  - "9. Тестирование": "09_testing.md"
  - "10. Этапы разработки": "10_roadmap.md"
  - "11. Приемка": "11_acceptance.md"
  - "Приложение А. API": "app_a_api.md"
  - "Приложение Б. Модели данных": "app_b_models.md"
