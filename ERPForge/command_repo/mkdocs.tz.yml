site_name: "Техническое задание ERPForge"
site_url: "https://erpforge.github.io/command_repo/"
site_description: "Техническое задание по ГОСТ 34 на разработку ERP-системы"

theme:
  name: material
  language: ru
  palette:
    primary: teal
    accent: cyan
  features:
    - navigation.sections
    - navigation.expand
    - toc.integrate

plugins:
  - search
  - kroki:
      ServerUrl: https://kroki.io
      FileType: svg

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - "Введение": "docs/index.md"
  - "1. Общие сведения": "docs/01_scope.md"
  - "2. Назначение и цели": "docs/02_goals.md"
  - "3. Характеристики объекта": "docs/03_characteristics.md"
  - "4. Требования к системе": "docs/04_requirements.md"
  - "5. Архитектура": "docs/05_architecture.md"
  - "6. Модули (домены)": "docs/06_modules.md"
  - "7. Интеграции": "docs/07_integrations.md"
  - "8. Безопасность": "docs/08_security.md"
  - "9. Тестирование": "docs/09_testing.md"
  - "10. Этапы разработки": "docs/10_roadmap.md"
  - "11. Приемка": "docs/11_acceptance.md"
  - "Приложение А. API": "docs/app_a_api.md"
  - "Приложение Б. Модели данных": "docs/app_b_models.md"
